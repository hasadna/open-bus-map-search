# Without this nginx sends no Cache-Control at all, leaving the browser to guess a lifetime
# from Last-Modified — the build time, so nothing is cached at all right after a deploy.
map $uri $cache_control {
    default                 "no-cache";                             # index.html, service-worker.js: version pointers, stored but always revalidated
    ~^/(storybook/)?assets/ "public, max-age=31536000, immutable";  # Vite fingerprints every file it emits here
    ~*\.(png|ico|svg)$      "public, max-age=604800";               # public/, unhashable: URLs are built at runtime (`/bus-logos/${operator_id}.svg`)
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;  # don't leak the nginx version in the Server header / error pages

    # Level 5 is where the curve flattens: it takes the 827KB main bundle to 249KB, level 9
    # saves a further 0.6KB for 60% more CPU. text/html is compressed unconditionally and
    # cannot be named in gzip_types; png/ico/woff2 are already compressed and stay out.
    # gzip_proxied's default (`off`) skips any request carrying a Via header, which is
    # exactly what a proxy in front of this nginx adds.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml text/xml;

    # Two locations serve from the same root with near-identical headers. nginx does not
    # inherit add_header into a location that sets its own, so every header is repeated in
    # both blocks — keep them in sync.

    # Storybook (built to /storybook). Headers mirror the app block below; its CSP differs
    # only where Storybook needs it (see the directive notes on the CSP line). Declared
    # before `location /` so it matches first.
    location /storybook/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /storybook/index.html;

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;                        # block MIME sniffing
        add_header X-Frame-Options SAMEORIGIN always;                            # legacy clickjacking guard (see frame-ancestors)
        add_header X-XSS-Protection 0 always;                                    # deprecated; OWASP recommends disabling
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; # isolate the browsing context, keep popups
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;  # disable unused features + Topics API
        # CSP — the app block below documents each directive; Storybook differs only in:
        # - script-src-elem 'unsafe-inline': Storybook's built HTML inlines its bootstrap <script>s.
        # - connect-src 'self' *.hasadna.org.il: MSW-mocked stories fetch the API (CSP is checked before the service worker intercepts).
        # - no GA/GTM hosts: Storybook runs no analytics.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-elem 'self' 'unsafe-inline'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.openstreetmap.fr https://*.openstreetmap.org; connect-src 'self' https://*.hasadna.org.il; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; frame-ancestors 'self';" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;                        # block MIME sniffing
        add_header X-Frame-Options SAMEORIGIN always;                            # legacy clickjacking guard (see frame-ancestors)
        add_header X-XSS-Protection 0 always;                                    # deprecated; OWASP recommends disabling
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; # isolate the browsing context, keep _blank/window.open links
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;  # disable unused features + Topics API (geolocation/clipboard/fullscreen/autoplay stay default-allowed)
        # CSP — mirrored by CSP_DIRECTIVES in csp.ts, which serves this same policy from
        # `npm start` / `npm run serve` so violations surface before deploy. csp.test.ts
        # asserts the two are byte-identical, so change this line and the test tells you
        # to mirror it there (it also requires the `always` below — without it nginx
        # drops the header on 4xx/5xx). Per directive:
        # - script-src: no 'unsafe-inline'/'unsafe-eval' (built index.html has no inline scripts); GA/GTM hosts load the analytics scripts.
        # - style-src-elem 'unsafe-inline': MUI/emotion and styled-components inject runtime <style> elements. style-src omits
        #   'unsafe-inline', so inline style="" attributes stay blocked (the app sets none — React style={{}} writes via the CSSOM).
        # - img-src: openstreetmap tiles, google-analytics beacon pixels, avatars.githubusercontent.com for the about page's contributor avatars.
        # - connect-src: *.hasadna.org.il for the stride/backend APIs, google-analytics/googletagmanager for analytics,
        #   api.github.com for the about page's contributor list.
        # - frame-src: youtube(-nocookie).com instruction videos, docs.google.com hackathon registration form.
        # - frame-ancestors 'self': CSP3 clickjacking control; same effect as the X-Frame-Options SAMEORIGIN above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.openstreetmap.fr https://*.openstreetmap.org https://www.google-analytics.com https://avatars.githubusercontent.com; connect-src 'self' https://*.hasadna.org.il https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://api.github.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://docs.google.com; worker-src 'self' blob:; frame-ancestors 'self';" always;
    }
}
