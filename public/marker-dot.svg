<!-- Marker for a standing ping. The band is drawn as a stroke rather than a fill, so `r` is the
     band's centre line and `stroke-width` its thickness: the ring spans r=6.5 to r=9.5 and
     leaves the hole in the middle open. The wider white circle under it is a halo, so the ring
     survives a dark basemap the way the bearing arrow does — this is an `<img>` on the map, out
     of reach of the stylesheet that themes its arrow counterpart. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <circle cx="10" cy="10" r="8" fill="none" stroke="#fff" stroke-width="4" />
  <circle cx="10" cy="10" r="8" fill="none" stroke="#000" stroke-width="3" />
</svg>
